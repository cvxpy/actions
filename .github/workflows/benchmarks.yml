name: benchmarks

on:
    workflow_call:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Checkout benchmark
        uses: actions/checkout@v5
        with:
          repository: cvxpy/benchmarks
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          pip install .
      
      - name: Checkout deployed branch
        uses: actions/checkout@v5
        with:
          repository: cvxpy/benchmarks
          ref: gh-pages
          path: deployed/

      - name: Copy contents to docs and results
        run: |
          mkdir docs
          mkdir results
          cp -a deployed/results/. results/
          cp -a deployed/docs/. docs/
      
      - name: Run benchmarks
        run: |
          asv machine --yes
          # -a number=1: each sample must be one fresh compile. get_problem_data caches
          # on the Problem, so timing it more than once per setup measures the cache.
          asv run "master -n 2" -a number=1 --show-stderr
          asv publish
      
      - name: Make pages folder
        run: |
          mkdir pages
          mv results pages/
          mv docs pages/
      
      - name: Deploy HTML and Results Artifacts
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: pages/
          repository-name: cvxpy/benchmarks
          branch: gh-pages
          ssh-key: "${{ secrets.BENCHMARK_DEPLOY_KEY }}"
